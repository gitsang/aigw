server:
  address: ":8080"
  admin_token: "change-me"
  read_timeout: 30s
  write_timeout: 0s
  idle_timeout: 120s
  cors_origins: ["http://localhost:5173", "http://localhost:8080"]

database:
  url: "postgres://aigw:aigw@localhost:5432/aigw?sslmode=disable"
  max_conns: 20
  min_conns: 2
  migrate: true

security:
  # Used to encrypt upstream provider API keys at rest. Change in production.
  encryption_key: "change-this-to-a-long-random-secret"

health:
  # A background check runs every minute by default.
  interval: 1m
  timeout: 10s
  concurrency: 8

# Per-request gateway limits. Retry/fallback policy is configured per virtual
# model in the console, not here.
gateway:
  request_timeout: 120s
  max_body_bytes: 33554432

# Optional price catalog used by the console's "同步价格" buttons. The catalog is
# cached in memory and refreshed after ttl; an empty url disables the feature.
modelsdev:
  url: "https://models.dev/api.json"
  ttl: 6h

web:
  dir: "./web/build"
